name: "CI Quality Gate"

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend-api/**"
      - "frontend-ui/**"
      - "infrastructure/**"
      - "manifests/**"
      - ".github/workflows/ci.yaml"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: "Backend: Lint & Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend-api/requirements*.txt"

      - name: "Install Backend Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r backend-api/requirements.txt
          pip install -r backend-api/requirements-dev.txt

      - name: "Lint Python Code (Flake8)"
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend-api/app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Treat warnings as non-fatal but report complexity
          flake8 backend-api/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: "Execute Pytest Suite"
        run: |
          PYTHONPATH=backend-api pytest backend-api/tests -v

  frontend-ci:
    name: "Frontend: Lint & Build Validation"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend-ui/package-lock.json"

      - name: "Install Node Dependencies"
        run: npm ci
        working-directory: ./frontend-ui

      - name: "Validate Frontend React Bundle Compilation"
        run: npm run build
        working-directory: ./frontend-ui

  terraform-ci:
    name: "Terraform: Format & Syntax Validation"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: "Check Terraform Canonical Formatting"
        run: terraform fmt -check -recursive
        working-directory: ./infrastructure

      - name: "Initialize Terraform (Local Provider Mode)"
        run: terraform init -backend=false
        working-directory: ./infrastructure

      - name: "Validate Terraform Configuration"
        run: terraform validate
        working-directory: ./infrastructure

  manifests-ci:
    name: "Kubernetes: Manifest Lint & Syntax Validation"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Install YAML Validator"
        run: pip install pyyaml

      - name: "Validate Kubernetes YAML Syntax & Structure"
        run: |
          echo "Validating all Kubernetes YAML manifests..."
          python -c "
          import glob, sys, yaml
          error = False
          for f in sorted(glob.glob('manifests/**/*.yaml', recursive=True) + glob.glob('manifests/**/*.yml', recursive=True)):
              try:
                  with open(f) as s:
                      docs = list(yaml.safe_load_all(s))
                      print(f'✓ {f} ({len(docs)} document(s))')
              except Exception as e:
                  print(f'✗ Error in {f}: {e}', file=sys.stderr)
                  error = True
          if error:
              sys.exit(1)
          "
