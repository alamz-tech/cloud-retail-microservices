apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rds-credentials-sync
  namespace: backend
  labels:
    app: backend-api
    app.kubernetes.io/part-of: cloud-retail
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: rds-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: retail-app/rds/credentials
        property: host
    - secretKey: DB_USER
      remoteRef:
        key: retail-app/rds/credentials
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: retail-app/rds/credentials
        property: password
    - secretKey: DB_NAME
      remoteRef:
        key: retail-app/rds/credentials
        property: dbname
    - secretKey: DB_PORT
      remoteRef:
        key: retail-app/rds/credentials
        property: port
