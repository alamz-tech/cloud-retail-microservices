# NGINX configuration for unprivileged user on port 8080
pid /tmp/nginx.pid;

server {
    listen 8080;
    server_name _;

    # Writable temp paths for unprivileged non-root execution
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Root directory containing compiled React static assets
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Health check probe for AWS ALB & Kubernetes liveness/readiness
    location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Static frontend assets routing (SPA fallback to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy forwarding /api/ requests to the internal Kubernetes DNS name
    # of the backend microservice (http://backend-api.backend.svc.cluster.local:8000/api/)
    location /api/ {
        proxy_pass http://backend-api.backend.svc.cluster.local:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Resilient timeout handling
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # Custom error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
